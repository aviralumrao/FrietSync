spring.application.name=backend
server.port=8080

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.cors.allowed-origins=http://localhost:5173,https://friet-sync.vercel.app,https://frietsync.me
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE}
app.auth.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL}

google.oauth.client-id=${GOOGLE_CLIENT_ID}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI}
google.oauth.state-ttl-seconds=${GOOGLE_OAUTH_STATE_TTL_SECONDS:600}
google.oauth.encryption-key=${GOOGLE_OAUTH_ENCRYPTION_KEY}
google.oauth.frontend-result-uri=${GOOGLE_OAUTH_FRONTEND_RESULT_URI:http://localhost:5173/settings/integrations}

aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

server.address=127.0.0.1
